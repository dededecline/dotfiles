# Tmux Configuration

# Enable mouse support
set -g mouse on

# Set default shell
set -g default-shell /opt/homebrew/bin/fish

# Terminal settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# 24-hour clock
set -g clock-mode-style 24

# Status bar configuration
set -g status-right-length 100
set -g status-left-length 100

# Catppuccin theme settings
# Palette source: ~/.config/.system/themes/catppuccin-frappe/palette.toml
# Install TPM first: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

# Catppuccin configuration (uses TPM plugin)
set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_modules_right "session"

# Use lavender as accent color
set -g @catppuccin_window_current_number_color "#{@thm_lavender}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_lavender}"

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
