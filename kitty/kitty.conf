# Kitty Terminal Configuration
# Converted from nix-config: https://github.com/dededecline/nix-config

# Shell
shell /opt/homebrew/bin/fish

# Scrollback
scrollback_lines 10000

# Audio
enable_audio_bell no

# Window appearance
background_opacity 0.3
background_blur 64
window_padding_width 20
hide_window_decorations titlebar-only

# Cursor configuration
cursor_shape underline
cursor_trail 4
cursor_blink_interval 0

# Tab bar customization
tab_bar_style separator
tab_bar_edge top
tab_bar_align left
tab_separator " "
active_tab_font_style italic
tab_title_template "╭─  ◆{index} {title[:16]} ─╮"
tab_activity_symbol " ✦"
tab_bar_min_tabs 1

# Font settings
font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 12.0

# Nerd Font symbol mapping (ensures icons render correctly)
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# Enable ligatures
disable_ligatures never


# Remote control
allow_remote_control yes

# Window close confirmation
confirm_os_window_close 0

# Keybindings
# Faster cursor movement (word-by-word with Option, line start/end with Cmd)
map alt+left send_text all \x1bb
map alt+right send_text all \x1bf
map cmd+left send_text all \x01
map cmd+right send_text all \x05

map cmd+f launch --type=overlay --stdin-source=@screen_scrollback /opt/homebrew/bin/fzf --no-sort --no-mouse --exact -i --tac
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Include Catppuccin Frappe theme
# Source: ~/.config/themes/catppuccin-frappe/
include ../themes/catppuccin-frappe/kitty.conf
