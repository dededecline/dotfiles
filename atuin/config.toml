# Atuin Configuration
# https://docs.atuin.sh/configuration/config/

# Search
workspaces = true
exit_mode = "return-query"

# Sync
sync_frequency = "5m"

# UI
inline_height = 15
enter_accept = true

# Privacy
history_filter = [
  "^export .*=",
  "^source .*secrets",
]

[stats]
common_subcommands = [
  "git",
  "docker",
  "kubectl",
  "npm",
  "brew",
  "cargo",
  "fish"
]
common_prefix = ["sudo"]
ignored_commands = ["cd", "ls", "ll", "la", "clear", "pwd"]

[sync]
records = true

[theme]
name = "catppuccin-frappe-lavender"
