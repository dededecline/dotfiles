# Atuin Configuration
# https://docs.atuin.sh/configuration/config/

# Search
search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "host"
workspaces = true

# Sync
auto_sync = true
sync_frequency = "5m"
update_check = true

# UI
style = "compact"
show_preview = true
max_preview_height = 4
inline_height = 40
enter_accept = true
show_help = true

# macOS
ctrl_n_shortcuts = true

# Privacy
secrets_filter = true
history_filter = [
  "^export .*=",
  "^source .*secrets",
]

[stats]
common_subcommands = ["git", "docker", "kubectl", "npm", "brew", "cargo", "fish"]
common_prefix = ["sudo"]
ignored_commands = ["cd", "ls", "ll", "la", "clear", "pwd"]

[sync]
records = true

[theme]
name = "catppuccin-frappe-lavender"
